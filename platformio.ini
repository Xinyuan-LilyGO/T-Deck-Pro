; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

; *******************************************************
;  To use the A7682E, you must plug in the battery
; *******************************************************
; src_dir = examples/A7682E/test_AT
; src_dir = examples/A7682E/deep_sleep

; src_dir = examples/bq27220
; src_dir = examples/bq25896_shutdown
; src_dir = examples/test_ai_chat
; src_dir = examples/test_BHI260AP
; src_dir = examples/test_EPD
; src_dir = examples/test_GPS
; src_dir = examples/test_keypad
; src_dir = examples/test_lora_recv
; src_dir = examples/test_lora_send
; src_dir = examples/test_lvgl
; src_dir = examples/test_bluetooth
; src_dir = examples/test_motor/audio
; src_dir = examples/test_motor/basic
; src_dir = examples/test_motor/complex
; src_dir = examples/test_motor/realtime
; src_dir = examples/test_pcm5102a
; src_dir = examples/test_sd
; src_dir = examples/test_touchpad
; src_dir = examples/test_wifi
; src_dir = examples/factory
; src_dir = examples/pda2
 src_dir = examples/factory2

#**************************
#  For screen touch
#**************************
; src_dir = examples/touch_hyn_core/arduino

; *******************************************************
boards_dir = boards
build_cache_dir = .pio/cache
default_envs = T-Deck-Pro
; src_dir = examples/${platformio.default_envs}

; -------------------------------------------------------
; Common settings shared by all environments
; -------------------------------------------------------
[env]
platform = espressif32
board = T-Deck-Pro
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; monitor_filters = esp32_exception_decoder
; extra_scripts =  ./script/pos_extra_script.py

build_flags =
    -DBOARD_HAS_PSRAM

    ; Enable UARDUINO_ USB_ CDC_ ON_ BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Enable UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ; -DARDUINO_USB_CDC_ON_BOOT=0

    -DDISABLE_ALL_LIBRARY_WARNINGS
    -Wnarrowing

    ; LVGL config
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_INCLUDE_SIMPLE
    -DTINY_GSM_MODEM_SIM7672

    ; Debug output
    -DCORE_DEBUG_LEVEL=3
    -DDISABLE_DIAGNOSTIC_OUTPUT=1

lib_deps =
    ; zinggjm/GxEPD2@1.5.5
    ; jgromes/RadioLib@6.4.2
    ; lewisxhe/SensorLib@^0.2.0
    ; mikalhart/TinyGPSPlus @ ^1.0.3
    ; vshymanskyy/TinyGSM@^0.12.0
    ; lvgl/lvgl @ ~8.3.9
    ; lewisxhe/XPowersLib @ ^0.3.0
    ; adafruit/Adafruit TCA8418 @ ^1.0.1
    ; adafruit/Adafruit BusIO @ ^1.14.4
    ; olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    ; adafruit/Adafruit GFX Library@^1.11.10
    ; esphome/ESP32-audioI2S#v3.0.12
    SPI
    Wire
    FS
    SPIFFS
    EEPROM
    links2004/WebSockets @ ^2.4.1

; -------------------------------------------------------
; Factory firmware — uses config/lv_conf.h
; To build: set src_dir = examples/factory, then pio run -e T-Deck-Pro
; -------------------------------------------------------
[env:T-Deck-Pro]
build_flags =
    ${env.build_flags}
    -I config
    -include config/lv_conf.h

; -------------------------------------------------------
; PDA application — uses examples/pda/lv_conf.h + custom partitions
; To build: set src_dir = examples/pda, then pio run -e pda
; -------------------------------------------------------
[env:pda]
build_flags =
    ${env.build_flags}
    -DARDUINO_T_DECK_PRO
    -include examples/pda/lv_conf.h
board_build.partitions = examples/pda/partitions.csv
